[package]
name = "kaven-docker"
version = "0.2.0-rc.1"
description = "A private Docker Registry desktop manager"
authors = ["Kaven"]
edition = "2021"

[lib]
name = "kaven_docker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "socks"] }
bytes = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
